version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # Reduce concurrent PRs so reviewers can keep up
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Cooldown: wait N days after a new version is released before opening a PR.
    # This avoids premature updates and gives upstream time to ship fixes.
    cooldown:
      default-days: 3
      semver-patch-days: 1
      semver-minor-days: 4
      semver-major-days: 14
    # Only open PRs for new versions; never rebase onto stale PRs silently.
    rebase-strategy: "disabled"
    # Group transitive updates so we don't get a cascade of single-crate PRs.
    groups:
      rustcrypto-block-modes:
        patterns:
          - "cipher"
          - "ctr"
          - "cbc"
          - "cfb-mode"
          - "ofb"
          - "ghash"
          - "universal-hash"
        update-types:
          - "minor"
          - "patch"
      rustcrypto-formats:
        patterns:
          - "der"
          - "pem"
          - "pkcs1"
          - "pkcs5"
          - "pkcs7"
          - "pkcs8"
          - "pkcs10"
          - "x509-parser"
          - "asn1"
          - "const-oid"
          - "spki"
        update-types:
          - "minor"
          - "patch"
      rustcrypto-elliptic-curves:
        patterns:
          - "elliptic-curve"
          - "ecdsa"
          - "k256"
          - "p256"
          - "p384"
          - "sec1"
          - "sm2"
        update-types:
          - "minor"
          - "patch"
      rustcrypto-hash:
        patterns:
          - "digest"
          - "sha1"
          - "sha2"
          - "sha3"
          - "sm3"
          - "blake2"
          - "blake3"
          - "hmac"
          - "crypto-common"
          - "inout"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "cipher"
          - "ctr"
          - "cbc"
          - "cfb-mode"
          - "ofb"
          - "ghash"
          - "universal-hash"
          - "der"
          - "pem"
          - "pkcs1"
          - "pkcs5"
          - "pkcs7"
          - "pkcs8"
          - "pkcs10"
          - "x509-parser"
          - "asn1"
          - "const-oid"
          - "spki"
          - "elliptic-curve"
          - "ecdsa"
          - "k256"
          - "p256"
          - "p384"
          - "sec1"
          - "sm2"
          - "digest"
          - "sha1"
          - "sha2"
          - "sha3"
          - "sm3"
          - "blake2"
          - "blake3"
          - "hmac"
          - "crypto-common"
          - "inout"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "cipher"
          - "ctr"
          - "cbc"
          - "cfb-mode"
          - "ofb"
          - "ghash"
          - "universal-hash"
          - "der"
          - "pem"
          - "pkcs1"
          - "pkcs5"
          - "pkcs7"
          - "pkcs8"
          - "pkcs10"
          - "x509-parser"
          - "asn1"
          - "const-oid"
          - "spki"
          - "elliptic-curve"
          - "ecdsa"
          - "k256"
          - "p256"
          - "p384"
          - "sec1"
          - "sm2"
          - "digest"
          - "sha1"
          - "sha2"
          - "sha3"
          - "sm3"
          - "blake2"
          - "blake3"
          - "hmac"
          - "crypto-common"
          - "inout"
        update-types:
          - "minor"
          - "patch"
    # Temporarily ignore versions known to require SemVer-major-style code
    # adaptation. Re-evaluate when upstream stabilises.
    #
    # The entries below are intentionally coarse: dependabot's job is to flag
    # upstream releases, but upgrades that cross more than one minor (or that
    # touch cryptographic RNG / network-protocol surface) need a dedicated PR
    # with KAT/interop regression evidence, not a one-line Cargo.toml bump.
    # Re-evaluate each entry when the upstream API stabilises or when the
    # affected call sites are refactored.
    ignore:
      - dependency-name: "redis"
        # 0.26 → 0.27 was a major API break (ConnectionLike / AsyncCommands
        # rewritten). 0.27 → 0.32 accumulated further changes. Bump manually
        # together with deadpool-redis in a focused gm-tls PR.
        versions:
          - ">=0.27.0, <1.0.0"
          - ">=1.0.0, <2.0.0"
      - dependency-name: "deadpool-redis"
        # Tracks the redis-rs API; bumps land in lockstep with redis itself.
        # Touches only gm-tls (gRPC session-cache backend). Bump manually.
        versions:
          - ">=0.18.0"
      - dependency-name: "rand_core"
        # 0.6 → 0.10 spans four minors (0.7 / 0.8 / 0.9 / 0.10), each with
        # breaking changes to RngCore (notably 0.9's switch to fallible
        # try_fill_bytes and the deprecation of the infallible fill_bytes path).
        # Used across gm-crypto / gm-tls / gm-tlcp on security-critical RNG
        # paths (handshake random, SM2 ephemeral keygen, IVs/nonces, PMS).
        # Bump manually with KAT regression.
        versions:
          - ">=0.7.0"
      - dependency-name: "tokio"
        # Avoid surprise MSRV bumps; bump manually.
        versions:
          - ">=2.0.0, <3.0.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 3
    rebase-strategy: "disabled"