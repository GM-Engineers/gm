# cargo-deny configuration for gm-tls
# Production-grade security configuration

[licenses]
version = 2
# Only allow permissive licenses for commercial use without restrictions
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
ignore = ["RUSTSEC-2025-0141"] # bincode unmaintained - no safe upgrade