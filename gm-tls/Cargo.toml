[package]
authors = ["Eric Zhang"]
name = "gm-tls"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GM/TLS (国密TLS) core library with SM2/SM3/SM4 support"
repository = "https://github.com/GM-Engineers/gm"
keywords = ["tls", "gm", "sm2", "sm3", "sm4", "gmtls", "cryptography", "ssl"]
categories = ["cryptography", "network-programming", "security"]
rust-version = "1.85"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
gm-der = { path = "../gm-der", version = "0.1.0" }
gm-crypto = { path = "../gm-crypto", version = "0.1.0" }
indexmap = "2"
elliptic-curve = "0.13"
hex = "0.4"
subtle = "2.6"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2.2"

serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "net"] }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
x509-parser = "0.16"
time = "0.3"
thiserror = "2"
metrics = "0.23"
once_cell = "1.19"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }
deadpool-redis = "0.17"
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Optional: tonic gRPC integration
tonic = { version = "0.14", optional = true }
tower = { version = "0.5", optional = true }
futures = { version = "0.3", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tokio-stream = { version = "0.1", optional = true }
http = { version = "1", optional = true }
postcard = { version = "1", features = ["alloc"] }

[features]
default = []
grpc = ["tonic", "tower", "futures", "hyper-util", "tokio-stream", "http"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
bytes = "1"
futures = "0.3"
proptest = "1"
criterion = "0.5"
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "crypto_bench"
harness = false
