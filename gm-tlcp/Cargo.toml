[package]
authors = ["Eric Zhang"]
name = "gm-tlcp"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TLCP (Transport Layer Cryptographic Protocol, GB/T 38636-2020) core library in pure Rust with SM2/SM3/SM4 support"
repository = "https://github.com/GM-Engineers/gm"
keywords = ["tlcp", "gmtls", "gm", "sm2", "cryptography"]
categories = ["cryptography", "network-programming"]
rust-version = "1.85"
readme = "README.md"

# ---------------------------------------------------------------------------
# crates.io 发布清单控制
# ---------------------------------------------------------------------------
# 明确列出 crates.io **不**包含的路径，避免开发期工具/构建产物被打包：
#   - `interop/`: Tongsuo 互测脚本与构建产物（仅在 GitHub 仓库可见）
#   - `target/`: cargo 默认会排除，这里冗余声明做自检断言
#   - `.github/`: CI workflow，不属于 crate
#
# 任何 PR 引入 `cargo package --list --allow-dirty` 中可见的新增目录前，
# 请同时更新本表与 `scripts/check-publish.sh` 中的反断言列表，并在 CI
# 通过 check-publish 后再合并。
# ---------------------------------------------------------------------------
exclude = [
    # Tongsuo interop dev tooling (Docker scripts + build artifacts).
    "interop/**",
    # Internal publish/release self-check scripts (kept in the GitHub
    # repo, not on crates.io).
    "scripts/**",
    "PUBLISHING.md",
    # CI workflows — not part of the published crate.
    ".github/**",
    # Integration tests are repo-only: they require the GmSSL binary
    # on PATH (see tests/gmssl_interop.rs) and `tests/support/` has
    # GmSSL-specific PEM/PBKDF2 helpers that aren't useful to
    # downstream users. Unit tests live inline in src/ via
    # `#[cfg(test)]` and DO get exercised by every `cargo test`.
    "tests/**",
    # Cargo defaults — kept for explicit self-check assertions.
    "/target",
    "*.log",
]

[dependencies]
# 国密算法原语（SM2/SM3/SM4/SM9）
gm-crypto = { path = "../gm-crypto", version = "0.3" }
gm-sm9-rs = { path = "../gm-sm9-rs", version = "0.1", default-features = false, features = ["pure-rust"] }

# Underlying EC primitive for the TLCP PMS KDF (x_hat transform,
# ProjectivePoint arithmetic). We re-export gm-crypto's transitive
# dep here to keep the pms module self-contained.
elliptic-curve = "0.13"
sm2 = { version = "0.13", features = ["arithmetic"] }

# 异步运行时（handshake / 流 I/O）
tokio = { version = "1", features = ["io-util", "net", "sync"] }

# 错误定义
thiserror = "2"

# 密钥材料零化（握手密钥、会话密钥等敏感数据）
zeroize = { version = "1", features = ["derive"] }

# 安全随机数（handshake random、临时密钥对等）
rand_core = { version = "0.6", features = ["getrandom"] }
rand = { version = "0.10" }  # for SM9 IBC sign/encrypt (rand_core 0.6 OsRng doesn't impl rand 0.10 CryptoRng)

# 常量时间比较（Finished 验签、HMAC 等）
subtle = "2.6"

# 结构化日志（handshake 状态、alert、错误追踪）

# Prometheus 指标（仅 record_bytes）
metrics = "0.23"

[features]
default = []

# DEPRECATED — kept as a no-op for source-level compatibility with
# 0.2.x callers' build scripts. (See CHANGELOG 0.3.0.)
#
# In 0.2.x, `--features tlcp-strict` selected GB/T 38636-2020
# spec-conformant behaviour (drop CKE u16 prefix, skip SKE for
# static-ECC, SM2-KAP PMS, etc.). In 0.3.0 that behaviour IS the
# default; this entry is preserved only so that existing
# `Cargo.toml` lines like
#     gm-tlcp = { version = "0.3", features = ["tlcp-strict"] }
# continue to compile without a "feature not found" error. The
# flag has no effect. Use no feature (or `tlcp-gmssl-compat`
# below) instead.
tlcp-strict = []

# GmSSL-master wire-compatibility shim.
#
# When enabled, gm-tlcp restores the historical deviations that the
# 0.2.x default build carried for byte-for-byte interop with GmSSL
# 2026-06+ master (the legacy PRC TLCP deployment target):
#   * ClientKeyExchange body has a redundant `uint16` length prefix
#     that the spec (RFC 5246 §7.4.7 / GB/T 38636-2020 §6.4.1.6)
#     does not require.
#   * Server emits an ECDHE-style ServerKeyExchange for static-ECC
#     suites (E013/E053) instead of the spec interpretation-B
#     sig-only SKE that openHiTLS / Tongsuo 8.3.0 expect.
#   * Server-side ECDHE PMS computes the raw 32-byte ECDH
#     x-coordinate instead of the 48-byte SM2-KAP output.
#   * Server does NOT send CertificateRequest / read client CV.
#
# New deployments targeting openHiTLS / Tongsuo / any standards-strict
# peer should NOT enable it. Legacy GmSSL-master deployments should
# opt in explicitly:
#     gm-tlcp = { version = "0.3", features = ["tlcp-gmssl-compat"] }
#
# Note (gm-tlcp 0.3.1, R-2): spec-B SKE is now the default for
# static-ECC suites. `tlcp-gmssl-compat` keeps the legacy
# ECDHE-style SKE emit on those suites for byte-for-byte interop
# with GmSSL master (interpretation-C).
tlcp-gmssl-compat = []

# 预留 feature 开关
# grpc   = []   # tonic / gRPC over TLCP（待实现）
# interop = []  # GmSSL 字节级对照向量（待实现）

[dev-dependencies]
# 集成测试用
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"

# PEM 解码（提取 server 公钥给 with_server_sign_key 用）
base64 = "0.22"

# 调试代理 hex 输出
hex = "0.4"

# 注：以下依赖**不**进本 crate（避免污染 TLCP 边界 / 未直接使用）：
#   - metrics/audit：emit 端直接用 tracing；落库/告警由应用层负责
#   - sqlx/redis：会话存储抽象由协议调用方决定（与 TLS 1.3 共用）
#   - x509-parser/time：仅 cert_verify 用，列入独立 cert-verify 子模块再决定
#   - serde：TLCP 握手消息不走 JSON/Postcard 等通用序列化（用 ASN.1 + 自有 PRF）
#   - async-trait：当前 API 用泛型而非 dyn trait
#   - gm-der：未直接引用，ASN.1 编码方案待定
#   - rand：rand_core 已足够；rand 0.10 仅 gm-tls 用（tls 1.3 握手流）
