[package]
authors = ["Eric Zhang"]
rust-version = "1.85"
name = "gm-ca"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GM/CA - Generic CA service for SM2 certificates"
repository = "https://github.com/GM-Engineers/gm"
keywords = ["ca", "certificate", "sm2", "pki", "gm"]
categories = ["cryptography"]
readme = "README.md"

[[bin]]
name = "gm-ca-server"
path = "src/main.rs"

[dependencies]
gm-der = { path = "../gm-der", version = "0.1.0" }
gm-crypto = { path = "../gm-crypto", version = "0.3" }
gm-tls = { path = "../gm-tls", features = ["grpc"], version = "0.2.0" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14" }
tonic-health = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "any", "time", "chrono"] }
chrono = "0.4"
time = { version = "0.3", features = ["serde"] }
x509-parser = { version = "0.16", features = ["verify"] }
pem = "3"
thiserror = "2"
hex = "0.4"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
# Optional: RSA CA signer for the TLCP RSA suites (E019/E01C/E059/E05A).
# Gated behind the `rsa` feature flag so the default GM/CA build stays
# strictly SM2 + 国密. Versions synced with gm-tlcp 0.6.x.
rsa  = { version = "0.9", default-features = false, optional = true, features = ["std", "pem", "sha2"] }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }

[features]
# The `rsa` feature enables `RsaCaSigner` for issuing X.509 certs with
# RSA SPKI + sha256WithRSAEncryption signatures. Required for the TLCP
# RSA cipher suites (GB/T 38636-2020 §6.4.5.2.1 表 2 — E019/E01C/E059/E05A).
# Off by default to keep the 国密-only CA build default-clean; the SM2
# signing path is the canonical path for GM systems.
rsa = ["dep:rsa", "dep:sha2", "dep:sha1"]
# The `tlcp-profiles` feature exposes `gm_ca::profiles::tlcp` — a set
# of TLCP-specific `CertProfile` presets (server_sign_ecc, server_enc_ecc,
# client_sign_ecc, plus server_rsa / client_rsa when combined with the
# `rsa` feature). These presets emit the KU/EKU/BC layout the GB/T 38636
# §6.4.6 spec / GmSSL master / openHiTLS expect for TLCP end-entity
# certs. Off by default to keep the base `CertProfile` API surface
# minimal for non-TLCP deployments.
tlcp-profiles = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# gm-tlcp is used by `tests/tlcp_loopback.rs` (Phase 6a / Phase 4g) to do
# in-process loopback handshakes against the 4 TLCP RSA suites using
# certs issued by `RsaCaSigner`. `default-features = false` skips the
# optional `tlcp-gmssl-compat` flag (we only need the default GB/T 38636
# spec-compliant wire format).
gm-tlcp = { path = "../gm-tlcp", version = "0.6", default-features = false }

[build-dependencies]
tonic-build = { version = "0.14", features = ["transport"] }
tonic-prost-build = "0.14"
