syntax = "proto3";

package gm.ca.v1;

service CaService {
    rpc SignCertificate(SignCertificateRequest) returns (SignCertificateResponse);
    rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
    rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);
    rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);
    rpc GetCrl(GetCrlRequest) returns (GetCrlResponse);
}

message SignCertificateRequest {
    string csr_pem = 1;
    int64 validity_days = 2;
    // PR-3.1 (gm-ca 0.3.0): sub-day TTL (SPIRE SVID rotation).
    // When > 0, takes precedence over `validity_days`. Range:
    // 1..=31536000 (1s .. 365d). Pre-v0.3.0 clients leave this 0.
    int64 validity_seconds = 3;
    // PR-3.1 (gm-ca 0.3.0): caller-supplied CertProfile serialized as
    // JSON (see `gm_ca::cert_profile::CertProfile` for the schema).
    // Empty string = fall back to `CertProfile::default()` (legacy
    // v0.1.x / v0.2.x wire format). Used by SPIRE Server to pass
    // SPIFFE-ID URI SANs + the appropriate KU/EKU layout.
    string profile_json = 4;
}

message SignCertificateResponse {
    string certificate_pem = 1;
    string error_code = 2;
    string error_message = 3;
}

message RenewCertificateRequest {
    string serial_number = 1;
    int64 validity_days = 2;
    // PR-3.1 (gm-ca 0.3.0): sub-day TTL on renewal (SPIRE SVID rotation).
    // See SignCertificateRequest.validity_seconds for precedence.
    int64 validity_seconds = 3;
    // PR-3.1 (gm-ca 0.3.0): optional profile override on renewal.
    // Empty string = keep the original cert's profile (legacy
    // behavior). JSON-encoded per `CertProfile`.
    string profile_json = 4;
}

message RenewCertificateResponse {
    string certificate_pem = 1;
    string error_code = 2;
    string error_message = 3;
}

message RevokeCertificateRequest {
    string serial_number = 1;
    int32 reason = 2;
}

message RevokeCertificateResponse {
    bool success = 1;
    string error_code = 2;
    string error_message = 3;
}

message GetCertificateRequest {
    string serial_number = 1;
}

message GetCertificateResponse {
    string certificate_pem = 1;
    string issuer = 2;
    string not_before = 3;
    string not_after = 4;
    string status = 5;
    string error_code = 6;
    string error_message = 7;
}

message GetCrlRequest {
    string issuer_cn = 1;
}

message GetCrlResponse {
    bytes crl_der = 1;
    string error_code = 2;
    string error_message = 3;
}

message CaError {
    string code = 1;
    string message = 2;
}
